<div>

	<style>

		/* =========================
		DATA LOAD ロゴ
		========================= */
		.img_label_load {
			position: absolute !important;
			left: 20px !important;
			top: 20px !important;

			width: 220px !important;
			height: auto !important;

			z-index: 10 !important;
		}


		/* =========================
		ロード一覧
		========================= */
		.area_save_list {
			position: absolute !important;

			left: 80px !important;
			top: 135px !important;

			width: 800px !important;
			height: 470px !important;

			overflow-y: auto !important;
			overflow-x: hidden !important;

			z-index: 5 !important;
		}


		.save_list {
			width: 100% !important;
			margin: 0 !important;
			padding: 0 !important;
		}


		/* =========================
		ロードデータ1件
		========================= */
		.save_list_item {
			display: flex !important;
			align-items: stretch !important;

			width: 100% !important;
			height: 120px !important;
			min-height: 120px !important;

			gap: 0 !important;
			margin-bottom: 8px !important;

			box-sizing: border-box !important;
		}


		/* =========================
		左側サムネイル
		========================= */
		.save_list_item_thumb {
			position: relative !important;

			left: 0 !important;
			top: 0 !important;

			display: block !important;

			flex: 0 0 190px !important;

			width: 190px !important;
			height: 120px !important;

			margin: 0 !important;
			padding: 0 !important;

			overflow: hidden !important;
			box-sizing: border-box !important;

			background: none !important;
			background-image: none !important;
		}


		/* セーブ済み画像 */
		.save_list_item_thumb img {
			display: block !important;

			width: 190px !important;
			height: 120px !important;

			max-width: none !important;
			max-height: none !important;

			margin: 0 !important;
			padding: 0 !important;

			object-fit: cover !important;
			object-position: center center !important;

			box-sizing: border-box !important;
		}


		/* NO IMAGE */
		.save_list_item_thumb img.noimage {
			width: 190px !important;
			height: 120px !important;

			object-fit: fill !important;
			object-position: center center !important;
		}


		/* =========================
		右側：日時・文章
		========================= */
		.save_list_item_area {
			display: block !important;

			flex: 1 1 auto !important;
			height: 120px !important;

			margin: 0 !important;
			padding: 15px 20px !important;

			box-sizing: border-box !important;
		}


		/* 日時 */
		.save_list_item_date {
			display: block !important;

			color: #d96a00 !important;

			margin-bottom: 6px !important;
		}


		/* 文章 */
		.save_list_item_text {
			display: block !important;

			color: #d8c7b5 !important;

			margin-top: 6px !important;
		}


		/* =========================
		カーソルを当てた時
		========================= */
		.save_list_item:hover .save_list_item_text {
			color: #5a4638 !important;
		}

		.save_list_item:hover .save_list_item_date {
			color: #c65300 !important;
		}


		/* =========================
		BACK
		========================= */
		.menu_item {
			position: absolute !important;

			right: 25px !important;
			top: 20px !important;

			margin: 0 !important;

			z-index: 20 !important;
		}


		.menu_close {
			display: block !important;

			width: 120px !important;
			height: 120px !important;

			object-fit: contain !important;

			cursor: pointer !important;
		}


		/* =========================
		スクロールバー
		========================= */
		.area_save_list::-webkit-scrollbar {
			width: 10px;
		}

		.area_save_list::-webkit-scrollbar-track {
			background: rgba(0, 0, 0, 0.5);
		}

		.area_save_list::-webkit-scrollbar-thumb {
			background: #9b4300;
			border-radius: 5px;
		}

	</style>


	<!-- =========================
	BACK
	========================= -->
	<div class="menu_item">

		<img
			class="menu_close"
			src="./data/image/newsystem/menu_button_close_menu.png"
		/>

	</div>


	<div style="clear:both;"></div>


	<!-- =========================
	ロード一覧
	========================= -->
	<div class="area_save_list">

		<ul class="save_list">

			{{for array_save}}

				<li
					class="save_display_area save_list_item"
					data-num="{{:num}}"
				>


					<!-- サムネイル -->
					<span class="save_list_item_thumb">

						{{if img_data != ""}}

							<img src="{{:img_data}}">

						{{else}}

							<img
								class="noimage"
								src="data/image/noimage.png"
							>

						{{/if}}

					</span>


					<!-- 日時・文章 -->
					<span class="save_list_item_area">

						<span class="save_list_item_date">
							{{:save_date}}
						</span>

						<span class="save_list_item_text">
							{{:title}}
						</span>

					</span>


				</li>

			{{/for}}

		</ul>

	</div>


	<!-- =========================
	DATA LOAD ロゴ
	========================= -->
	<img
		class="img_label img_label_load"
		src="data/image/newsystem/label_load.png"
		style="
			left:0;
			top:0;
			position:absolute;
		"
	>


	<!-- =========================
	背景
	========================= -->
	<img
		class="img_bg_base"
		src="data/image/newsystem/bg_base.png"
		style="
			z-index:-1;
			left:0;
			top:0;
			width:100%;
			height:100%;
			position:absolute;
		"
	>

</div>
