<!DOCTYPE html>
<html>
    <head>
        <title>Loading TyranoScript</title>

        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
        <meta name="robots" content="noindex,nofollow" />

        <link href="./tyrano/tyrano.css" rel="stylesheet" />
        <link href="./tyrano/libs/jquery-ui/jquery-ui.css" rel="stylesheet" />
        <link rel="shortcut icon" href="data\image\favicon.ico" type="image/x-icon">

        <!-- jQuery -->
        <script src="./tyrano/libs/jquery-3.6.0.min.js"></script>

        <script>
            try {
                window.jQuery = window.$ = require("./tyrano/libs/jquery-3.6.0.min.js");
            } catch (e) {}

            try {

                if (window.studio_api) {

                    // Win・Macなど パッケージング時
                    window.studio_api = window.studio_api;
                    window.process =
                        window.studio_api.ipcRenderer.sendSync("getProcess");

                } else if (
                    window.opener &&
                    window.opener.window &&
                    window.opener.window.studio_api
                ) {

                    // プレビュー時
                    window.studio_api =
                        window.opener.window.studio_api;

                    window.process =
                        window.opener.window.studio_api.ipcRenderer.sendSync(
                            "getProcess"
                        );
                }

            } catch (e) {}
        </script>

        <!-- jQuery Plugins -->
        <script src="./tyrano/libs/jquery-migrate-1.4.1.js"></script>
        <script src="./tyrano/libs/jquery-ui/jquery-ui.min.js"></script>
        <script src="./tyrano/libs/jquery.a3d.js"></script>
        <script src="./tyrano/libs/jsrender.min.js"></script>

        <!-- alertify.js -->
        <link
            href="./tyrano/libs/alertify/alertify.core.css"
            rel="stylesheet"
        />

        <link
            href="./tyrano/libs/alertify/alertify.default.css"
            rel="stylesheet"
        />

        <script src="./tyrano/libs/alertify/alertify.min.js"></script>

        <!-- remodal -->
        <link
            href="./tyrano/libs/remodal/remodal.css"
            rel="stylesheet"
        />

        <link
            href="./tyrano/libs/remodal/remodal-default-theme.css"
            rel="stylesheet"
        />

        <script src="./tyrano/libs/remodal/remodal.js"></script>

        <!-- html2canvas -->
        <script src="./tyrano/libs/html2canvas.js"></script>

        <!-- KeyConfig.js -->
        <script src="./data/system/KeyConfig.js"></script>

        <!-- TyranoScript -->
        <script src="./tyrano/lang.js"></script>
        <script src="./tyrano/libs.js"></script>
        <script src="./tyrano/tyrano.js"></script>
        <script src="./tyrano/tyrano.base.js"></script>
        <script src="./tyrano/plugins/kag/kag.js"></script>
        <script src="./tyrano/plugins/kag/kag.event.js"></script>
        <script src="./tyrano/plugins/kag/kag.key_mouse.js"></script>
        <script src="./tyrano/plugins/kag/kag.layer.js"></script>
        <script src="./tyrano/plugins/kag/kag.menu.js"></script>
        <script src="./tyrano/plugins/kag/kag.parser.js"></script>
        <script src="./tyrano/plugins/kag/kag.rider.js"></script>
        <script src="./tyrano/plugins/kag/kag.studio_v6.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag_audio.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag_camera.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag_ext.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag_system.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag_vchat.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag_ar.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag_three.js"></script>
        <script src="./tyrano/plugins/kag/kag.tag.js"></script>

        <!-- Others -->
        <link
            href="./tyrano/libs/textillate/assets/animate.css"
            rel="stylesheet"
        />

        <script src="./tyrano/libs/textillate/assets/jquery.lettering.js"></script>
        <script src="./tyrano/libs/textillate/jquery.textillate.js"></script>
        <script src="./tyrano/libs/jquery.touchSwipe.min.js"></script>
        <script src="./tyrano/libs/howler.js"></script>
        <script src="./tyrano/libs/jsQR.js"></script>
        <script src="./tyrano/libs/anime.min.js"></script>
        <script src="./tyrano/libs/lz-string.min.js"></script>


        <!-- =========================================
             起動中 NOW LOADING 画面
        ========================================== -->

        <style>

            html,
            body {
                margin: 0;
                padding: 0;

                width: 100%;
                height: 100%;

                background: #000;
            }


            /* Tyrano本体が構築される前も黒にする */
            #tyrano_base {
                background: #000 !important;
            }


            /* =====================================
               ローディング画面全体
            ====================================== */

            #startup_loading {

                position: fixed;

                left: 0;
                top: 0;

                width: 100vw;
                height: 100vh;

                background: #000;

                display: flex;

                align-items: center;
                justify-content: center;

                z-index: 99999999;

                color: #fff;

                font-family:
                    "Yu Gothic",
                    "YuGothic",
                    "Hiragino Kaku Gothic ProN",
                    "Meiryo",
                    sans-serif;

                user-select: none;

                /*
                    裏側にMENUボタン等が生成されても
                    起動中は操作できないようにする
                */
                pointer-events: all;
            }


            #startup_loading_inner {

                text-align: center;

            }


            /* NOW LOADING... */

            #startup_loading_title {

                margin: 0 0 14px 0;

                font-size: 28px;

                font-weight: 500;

                letter-spacing: 5px;

                line-height: 1.5;

            }


            /* 読み込み中です */

            #startup_loading_text {

                margin: 0;

                font-size: 14px;

                font-weight: 400;

                letter-spacing: 2px;

                line-height: 1.6;

            }


            /* ● ● ● */

            #startup_loading_dots {

                margin-top: 20px;

                font-size: 18px;

                font-weight: 400;

                letter-spacing: 6px;

                animation:
                    startup_loading_blink
                    1.2s
                    ease-in-out
                    infinite;

            }


            /* 点滅 */

            @keyframes startup_loading_blink {

                0% {
                    opacity: 0.2;
                }

                50% {
                    opacity: 1;
                }

                100% {
                    opacity: 0.2;
                }

            }

        </style>

    </head>


    <body
        onselectstart="return false"
        onContextmenu="return false"
        ontouchmove="event.preventDefault()"
    >


        <!-- =========================================
             起動中に最前面へ表示 
        ========================================== -->

        <div id="startup_loading">

            <div id="startup_loading_inner">

                <div id="startup_loading_title">
                    NOW LOADING...
                </div>

                <div id="startup_loading_text">
                    読み込み中です
                </div>

                <div id="startup_loading_dots">
                    ● ● ●
                </div>

            </div>

        </div>


        <!-- =========================================
             TyranoScript 本体
        ========================================== -->

        <div
            id="tyrano_base"
            class="tyrano_base"
            style="overflow: hidden"
            unselectable="on"
            ondragstart="return false"
        ></div>


        <div
            id="vchat_base"
            class="vchat_base"
            style="overflow: hidden"
            unselectable="on"
            ondragstart="return false"
        ></div>


        <!--
            Firstシナリオファイルに外部ファイルを利用する場合
        -->

        <!--
        <input
            type="hidden"
            id="first_scenario_file"
            value="http://test.com/tyrano/data/scenario/first.ks"
        >
        -->


        <!--
            コンフィグ調整
        -->

        <!--
        <input
            type="hidden"
            tyrano="config"
            key="vchat"
            value="true"
        />

        <input
            type="hidden"
            tyrano="config"
            key="vchatMenuVisible"
            value="true"
        />
        -->


        <!-- =========================================
             モーダル
        ========================================== -->

        <div class="remodal-bg"></div>


        <div
            class="remodal"
            data-remodal-id="modal"
            data-remodal-options="
                hashTracking:false,
                closeOnEscape:false,
                closeOnOutsideClick:false
            "
        >

            <h1 class="remodal_title"></h1>

            <p class="remodal_txt"></p>

            <br />


            <button
                data-remodal-action="cancel"
                id="remodal-cancel"
                class="remodal-cancel"
            >
                Cancel
            </button>


            <button
                data-remodal-action="confirm"
                id="remodal-confirm"
                class="remodal-confirm"
            >
                OK
            </button>

        </div>


    </body>
</html>
